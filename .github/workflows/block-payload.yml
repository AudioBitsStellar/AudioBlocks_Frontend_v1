name: block-payload
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail on known payload markers
        run: node scripts/block-payload.cjs
      - name: Verify payload scanner fixtures
        run: node scripts/block-payload.cjs --self-test
