# Security scanning (#300, #845).
#
# Three layers of scanning:
#   1. Dependency vulnerabilities — `npm audit` fails the check on any high or
#      critical vulnerability in the production dependency tree (warnings only
#      for moderate/low). Raise fixes with `npm audit` / Dependabot.
#   2. Source code scanning — GitHub CodeQL analyzes the JavaScript/TypeScript
#      codebase and reports security defects as code-scanning alerts (does not
#      gate the build).
#   3. Container image scanning — Trivy builds the production Dockerfile and
#      fails on any CRITICAL/HIGH vulnerability in the OS packages or app
#      dependencies baked into the final image.
name: security

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/docker-entrypoint.js'
      - 'scripts/scan-client-secrets.cjs'
      - 'next.config.ts'
      - '.github/workflows/**'
  push:
    branches: [main]
  schedule:
    # Weekly re-scan of the default branch to catch newly published advisories.
    - cron: '0 6 * * 1'

jobs:
  client-secret-boundary:
    name: Client bundle secret boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID: ci-dynamic-env
      - run: node scripts/scan-client-secrets.cjs

  dependency-audit:
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts --legacy-peer-deps

      # The single dependency policy blocks high and critical vulnerabilities.
      - name: Audit production vulnerabilities
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (code scanning)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3

      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          category: '/language:${{matrix.language}}'

  trivy-image-scan:
    name: Trivy (container image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: audioblocks-frontend:scan

      - name: Scan image for CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: audioblocks-frontend:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: trivy-results.sarif
