# Secret scanning (SEC-12, #793).
#
# Runs gitleaks over the full git history on every pull request and on pushes
# to main. The check fails if a secret-like string is found, so a committed key
# or token is caught before it is merged.
#
# The gitleaks CLI is pinned and installed directly from its release archive.
# The gitleaks-action wrapper requires a paid license key for
# organization-owned repositories, so it is not used here.
#
# Findings are printed with the matched value redacted. For a confirmed false
# positive, add a narrow allowlist entry to .gitleaks.toml with a comment that
# explains why it is safe.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.18.4'
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the whole history, not just the checked-out commit.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --exit-code 1
