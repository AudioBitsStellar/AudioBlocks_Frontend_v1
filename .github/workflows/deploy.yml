#  Production deploy pipeline (#841).
#
# `release.yml` only runs `semantic-release` (versioning/changelog/tag) — it
# never deploys anything. This workflow adds the actual deploy:
#   - staging:    every push to `main` (i.e. every merge), automatic.
#   - production: every version tag (`vX.Y.Z`, created by `semantic-release`
#                  in release.yml), gated by the `production` GitHub
#                  Environment's required reviewers.
#
# See docs/adr/0001-production-hosting-target.md for why Fly.io, and
# docs/DEPLOYMENT.md for the secrets/variables each environment needs.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  deploy-staging:
    name: Deploy to staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:staging-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.STAGING_SENTRY_DSN }}
            NEXT_PUBLIC_ANALYTICS_ENABLED=false
            NEXT_PUBLIC_SEGMENT_WRITE_KEY=${{ secrets.STAGING_SEGMENT_WRITE_KEY }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master

      - name: Deploy to Fly.io (staging)
        run: |
          flyctl deploy \
            --app "${{ vars.FLY_STAGING_APP }}" \
            --image "ghcr.io/${{ github.repository }}:staging-${{ github.sha }}" \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-production:
    name: Deploy to production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:production-latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PRODUCTION_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.PRODUCTION_SENTRY_DSN }}
            NEXT_PUBLIC_ANALYTICS_ENABLED=true
            NEXT_PUBLIC_SEGMENT_WRITE_KEY=${{ secrets.PRODUCTION_SEGMENT_WRITE_KEY }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master

      - name: Deploy to Fly.io (production)
        run: |
          flyctl deploy \
            --app "${{ vars.FLY_PRODUCTION_APP }}" \
            --image "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
